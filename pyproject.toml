[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bsoup"
version = "1.1.0"
description = "Asynchronous web scraper for Boursorama financial data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
]

[project.scripts]
bsoup = "bsoup.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bsoup"]
omit = ["tests/*", "bsoup/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]
